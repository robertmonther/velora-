# Builds the phone app from the app/ folder, for free, on GitHub's own machines.
#  - Android: a test file (APK) that installs on any Android phone. It is attached to the pre-release "android-test".
#  - Android, a look: the test file is opened on an Android emulator and pictures are taken (job "android-look").
#  - iPhone: only checks that the Xcode project builds (for the simulator). A file that installs on a real iPhone
#    needs Apple's paid developer account and its signing keys, which this repo does not have.
# Runs when something in app/ changes (or this file). To get a fresh build after site changes: raise the number in
# app/BUILD (it is also the build number the phone shows: test-5, test-6, ...).
# Every Android test build is signed with the same test key (app/android/test-signing), so a new build installs
# over the one before it. The job checks that, twice: the fingerprint, and a real install on top of the build before.
name: App test builds
on:
  push:
    branches: [upload-studio, main]
    paths: ["app/**", ".github/workflows/app.yml"]
permissions:
  contents: write
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci --no-audit --no-fund
      - run: node build-www.mjs
      - run: npx cap sync android
      - name: Build the test APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/velora-android-test.apk" && ls -la "$RUNNER_TEMP/velora-android-test.apk"
      - name: Check that it is signed with the repo's test key (the same key every time)
        run: |
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          got="$("$signer" verify --print-certs "$RUNNER_TEMP/velora-android-test.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          want="$(tr -d ' \n' < android/test-signing/SHA256)"
          echo "signed with: $got"; echo "expected:    $want"
          test -n "$got" && test "$got" = "$want"
      - uses: actions/upload-artifact@v4
        with: { name: velora-android-test, path: "${{ runner.temp }}/velora-android-test.apk", retention-days: 30 }
      - name: Keep the build before this one (the emulator job installs the new one on top of it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          gh release download android-test --pattern velora-android-test.apk --dir "$RUNNER_TEMP/previous" --repo "$GITHUB_REPOSITORY" || echo "no build before this one"
          ls -la "$RUNNER_TEMP/previous"
      - uses: actions/upload-artifact@v4
        with: { name: velora-android-previous, path: "${{ runner.temp }}/previous", retention-days: 7, if-no-files-found: ignore }
      - name: Put it where a phone can download it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build="$(tr -d ' \n' < BUILD)"
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test "$RUNNER_TEMP/velora-android-test.apk" --prerelease --target "$GITHUB_SHA" \
            --title "Android test build $build (for testing, not for the public)" \
            --notes "Test build $build of the app, from commit $GITHUB_SHA. It is signed with the test key, not for the Play Store. On an Android phone: download the .apk file, open it, and allow the install. From build 5 on, a new build installs over the one before it; a build older than 5 has to be removed from the phone first."
  # A look at the test file on a real Android (an emulator on GitHub's machine): it opens the app, taps the
  # microphone, answers the phone's own question, and takes pictures. The pictures are attached to the pre-release
  # "android-test" (look-a34-..., look-a36-...). Script: app/ci/look.py. Nobody here has an Android phone to hand.
  android-look:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: velora-android-test, path: apk }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: velora-android-previous, path: previous }
      - name: Let the emulator use this machine's hardware
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python3 app/ci/look.py look apk/velora-android-test.apk look-a${{ matrix.api }}- previous/velora-android-test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "velora-android-look-a${{ matrix.api }}", path: look, retention-days: 30 }
      - name: Put the pictures next to the test file
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-test look/* --clobber --repo "$GITHUB_REPOSITORY"
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: node build-www.mjs
      - run: npx cap sync ios
      - name: Check that the iPhone project builds (simulator, unsigned)
        working-directory: app/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build | tail -n 40
